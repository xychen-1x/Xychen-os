<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Updates — Xychen OS</title><link rel="stylesheet" href="/css/styles.css"></head><body><header><a href="/">Xychen OS</a></header><main><h1>Updates</h1><div id="updates"><p>Loading announcements…</p></div></main><script>fetch('/api/announcements').then(r=>r.json()).then(d=>document.getElementById('updates').innerHTML=(d.announcements||[]).map(a=>'<article><h2>'+a.title+'</h2><p>'+a.content+'</p></article>').join('')||'<p>No published announcements yet.</p>').catch(()=>{});</script></body></html>
